default: &default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV.fetch("DATABASE_URL") %>
  pool: <%= Integer(ENV.fetch("RAILS_MAX_THREADS", "5")) %>
  schema_search_path: public
  variables:
    timezone: UTC
    statement_timeout: 10000
    lock_timeout: 5000

development:
  <<: *default
test:
  <<: *default
production:
  <<: *default
