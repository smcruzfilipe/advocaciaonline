name: Backend

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://advocacia_runtime@advocacia-ci-db/advocacia_test
      MIGRATION_DATABASE_URL: postgresql://advocacia_migrator@advocacia-ci-db/advocacia_test
      DESPACHANTE_DATABASE_URL: postgresql://advocacia_despachante@advocacia-ci-db/advocacia_test
      COLETOR_DATABASE_URL: postgresql://advocacia_coletor@advocacia-ci-db/advocacia_test
      APP_ORIGIN: https://example.test
      GOOGLE_CLIENT_ID: test-client
      GOOGLE_CLIENT_SECRET: test-secret
      SECRET_KEY_BASE: test-only-secret-key-base-0123456789012345678901234567890123456789
      RAILS_LOG_LEVEL: fatal
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build test and despachante images
        run: |
          docker build --target test -t advocacia-ci:test backend
          docker build --target despachante -t advocacia-ci:despachante backend
      - name: Start isolated PostgreSQL as non-root
        run: |
          docker network create --internal advocacia-ci
          docker run -d --name advocacia-ci-db --network advocacia-ci --user 70:70 \
            --tmpfs /var/lib/postgresql:uid=70,gid=70,mode=0700 \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=advocacia_test \
            postgres:18.6-alpine3.23
          timeout 60 bash -c 'until docker exec advocacia-ci-db pg_isready -U postgres -d advocacia_test; do sleep 1; done'
      - name: Provision isolated roles
        run: |
          for file in provision.sql provision_despachante.sql provision_coletor.sql; do
            docker exec -i advocacia-ci-db psql -v ON_ERROR_STOP=1 -U postgres -d advocacia_test < "backend/db/$file"
          done
      - name: Apply migrations
        run: |
          docker run --rm --network advocacia-ci \
            -e RAILS_ENV -e DATABASE_URL -e MIGRATION_DATABASE_URL -e APP_ORIGIN -e SECRET_KEY_BASE \
            advocacia-ci:test ruby bin/migrate
      - name: Run backend suite
        run: |
          docker run --rm --network advocacia-ci \
            -e RAILS_ENV -e DATABASE_URL -e MIGRATION_DATABASE_URL -e DESPACHANTE_DATABASE_URL \
            -e COLETOR_DATABASE_URL -e APP_ORIGIN -e GOOGLE_CLIENT_ID -e GOOGLE_CLIENT_SECRET \
            -e SECRET_KEY_BASE -e RAILS_LOG_LEVEL advocacia-ci:test ruby bin/rails test
      - name: Remove isolated resources
        if: always()
        run: |
          docker rm -f advocacia-ci-db || true
          docker network rm advocacia-ci || true
