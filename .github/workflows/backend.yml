name: Backend

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://advocacia_runtime@advocacia-ci-db/advocacia_test
      MIGRATION_DATABASE_URL: postgresql://advocacia_migrator@advocacia-ci-db/advocacia_test
      DESPACHANTE_DATABASE_URL: postgresql://advocacia_despachante@advocacia-ci-db/advocacia_test
      PROCESSADOR_DATABASE_URL: postgresql://advocacia_processador@advocacia-ci-db/advocacia_test
      PROCESSADOR_TEST_ADMIN_DATABASE_URL: postgresql://postgres@advocacia-ci-db/advocacia_test
      APP_ORIGIN: https://example.test
      GOOGLE_CLIENT_ID: test-client
      GOOGLE_CLIENT_SECRET: test-secret
      SECRET_KEY_BASE: test-only-secret-key-base-0123456789012345678901234567890123456789
      RAILS_LOG_LEVEL: fatal
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build backend, despachante and processador images
        run: |
          docker build --target test -t advocacia-ci:test backend
          docker build --target despachante -t advocacia-ci:despachante backend
          docker build --target test -t advocacia-ci:processador-test etl
          docker build --target runtime -t advocacia-ci:processador etl
      - name: Start isolated PostgreSQL as non-root
        run: |
          docker network create --internal advocacia-ci
          docker run -d --name advocacia-ci-db --network advocacia-ci --user 70:70 \
            --tmpfs /var/lib/postgresql:uid=70,gid=70,mode=0700 \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=advocacia_test \
            postgres:18.6-alpine3.23
          timeout 60 bash -c 'until docker exec advocacia-ci-db pg_isready -h 127.0.0.1 -U postgres -d advocacia_test; do sleep 1; done'
      - name: Provision isolated roles
        run: |
          for file in provision.sql provision_despachante.sql provision_processador.sql; do
            docker exec -i advocacia-ci-db psql -v ON_ERROR_STOP=1 -U postgres -d advocacia_test < "backend/db/$file"
          done
      - name: Apply migrations
        run: |
          docker run --rm --network advocacia-ci \
            -e RAILS_ENV -e DATABASE_URL -e MIGRATION_DATABASE_URL -e APP_ORIGIN -e SECRET_KEY_BASE \
            advocacia-ci:test ruby bin/migrate
      - name: Run backend suite
        run: |
          docker run --rm --network advocacia-ci \
            -e RAILS_ENV -e DATABASE_URL -e MIGRATION_DATABASE_URL -e DESPACHANTE_DATABASE_URL \
            -e PROCESSADOR_DATABASE_URL -e APP_ORIGIN -e GOOGLE_CLIENT_ID -e GOOGLE_CLIENT_SECRET \
            -e SECRET_KEY_BASE -e RAILS_LOG_LEVEL advocacia-ci:test ruby bin/rails test
      - name: Run processador suite
        run: |
          docker run --rm --network advocacia-ci \
            -e PROCESSADOR_DATABASE_URL -e PROCESSADOR_TEST_ADMIN_DATABASE_URL advocacia-ci:processador-test
      - name: Smoke final despachante image
        run: |
          docker run --rm --network advocacia-ci \
            -e RAILS_ENV -e DATABASE_URL -e APP_ORIGIN -e SECRET_KEY_BASE -e RAILS_LOG_LEVEL \
            advocacia-ci:test ruby bin/rails runner '
              require "securerandom"
              token = SecureRandom.urlsafe_base64(32)
              IdentityStore.authenticate(subject: SecureRandom.uuid, email: "ci@example.test",
                token: token, csrf: SecureRandom.urlsafe_base64(32))
              LawyerOnboarding.call(token: token, input: {
                "full_name" => "CI Despachante Runtime",
                "primary_oab" => { "number" => "12345", "uf" => "SP" }, "secondary_oabs" => []
              })
              IdentityStore.revoke(token)
            '
          docker run --rm --network advocacia-ci -e DESPACHANTE_DATABASE_URL \
            --entrypoint ruby advocacia-ci:despachante -e '
              require "./despachante/run"
              require "pg"
              CourtCatalog.define_singleton_method(:fetch) { [{ code: "TJAC" }, { code: "TRF1" }] }
              runner = DespachanteRunner.new(despachante_url: ENV.fetch("DESPACHANTE_DATABASE_URL"),
                first: "04:00", second: "16:00")
              # Earlier suites retain global runs; avoid reusing one created before this fixture.
              date = PG.connect(ENV.fetch("DESPACHANTE_DATABASE_URL")) do |db|
                Date.iso8601(db.exec("SELECT (COALESCE(MAX(collection_date), current_date) + 1)::text FROM public.collection_runs").getvalue(0, 0))
              end
              now = Time.utc(date.year, date.month, date.day, 20)
              ids = runner.run_once(now: now)
              raise "slots are not distinct or idempotent" unless ids.length == 2 && ids.uniq.length == 2 &&
                runner.run_once(now: now) == ids
              PG.connect(ENV.fetch("DESPACHANTE_DATABASE_URL")) do |db|
                ids.each do |id|
                  row = db.exec_params(<<~SQL, [id, "lawyer", "name", "CI Despachante Runtime", "D"]).first
                    SELECT r.status, count(j.id) AS jobs, count(DISTINCT j.court) AS courts,
                      bool_and(j.medium = $5) AS diary_only
                    FROM public.collection_runs r
                    LEFT JOIN public.collection_jobs j ON j.run_id = r.id AND j.entity_type = $2
                      AND j.criteria ->> $3 = $4
                    WHERE r.id = $1 GROUP BY r.status
                  SQL
                  raise "planning did not produce distinct court work only for Diario Eletronico" unless
                    row && row["status"] == "planned" && row["jobs"].to_i == 2 &&
                    row["courts"].to_i == 2 && row["diary_only"] == "t"
                end
              end
              raise "despachante must run non-root" if Process.uid.zero?
              puts "Two distinct idempotent plans persisted with pending work; UID=#{Process.uid}"
            '
      - name: Remove isolated resources
        if: always()
        run: |
          docker rm -f advocacia-ci-db || true
          docker network rm advocacia-ci || true
