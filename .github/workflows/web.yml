name: Web

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify frontend in a non-root container
        run: |
          mkdir -p node_modules .next
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/workspace" \
            --tmpfs "/workspace/node_modules:exec,uid=$(id -u),gid=$(id -g),mode=0775" \
            --tmpfs "/workspace/.next:uid=$(id -u),gid=$(id -g),mode=0775" \
            --tmpfs /tmp:mode=1777 -w /workspace -e HOME=/tmp \
            node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53 \
            sh -c 'npm ci --ignore-scripts && npm run format:check && npm run lint && npm run typecheck && npm test && npm run build && npm audit --omit=dev --audit-level=high'
